services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: asw-scheduler
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  # For running migrations, you can use the following command:
  # `docker compose run --rm migrate` 
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    env_file:
      - .env
    volumes:
      - ./prisma:/app/prisma
    profiles:
      - tools
    command: npx prisma migrate deploy
